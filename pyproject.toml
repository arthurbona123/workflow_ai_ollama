[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-continue-proxy"
version = "0.1.0"
description = "Reverse Proxy em FastAPI + LangGraph com compactação de contexto e busca Tavily para o Continue.dev"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Seu Nome", email = "seu-email@exemplo.com" }
]

# Dependências principais de execução
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.30",
    "langchain-openai>=0.2.0",
    "tavily-python>=0.5.0",
]

# Dependências separadas para o ambiente de CI / Testes (pip install -e ".[dev]")
[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

# Configuração centralizada do PyTest
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=server --cov-report=term-missing --cov-report=xml --cov-report=markdown --cov-fail-under=80"
testpaths = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"

# Configuração centralizada do Coverage.py
[tool.coverage.run]
source = ["server"]
branch = true
omit = [
    "test_*.py",
    "*/__pycache__/*",
    ".venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]