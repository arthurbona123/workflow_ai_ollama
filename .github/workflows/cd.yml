name: CD - Build & Release Official Version

on:
  # Dispara automaticamente sempre que você enviar uma tag de versão (ex: v0.1.0, v1.0.0)
  push:
    tags:
      - "v*.*.*"
  # Permite também disparar manualmente pelo botão "Run workflow" na aba Actions do GitHub
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Versão da Release (ex: v0.1.0)"
        required: true
        default: "v0.1.0"

# Permissão necessária para o GitHub Actions criar Releases e anexar o .zip no repositório
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. Instalar Dependências e Ferramentas de Build
        run: |
          python -m pip install --upgrade pip build
          pip install -r requirements.txt

      - name: 4. Executar Testes de Sanidade antes do Deploy
        env:
          OPENAI_API_KEY: "ollama-mock"
          TAVILY_API_KEY: "tvly-mock"
        run: |
          pytest

      - name: 5. Definir Nome da Versão (Tag ou Input Manual)
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: 6. Empacotar Código-Fonte Limpo (.zip) e Pacote Python (Wheel)
        run: |
          mkdir -p dist
          
          # Gera o pacote instalável Python (.whl e .tar.gz) usando o pyproject.toml
          python -m build --outdir dist/
          
          # Cria o arquivo .zip completo com o source code limpo
          ZIP_NAME="langgraph-continue-proxy-${{ steps.vars.outputs.VERSION }}-source.zip"
          zip -r "dist/${ZIP_NAME}" . \
            -x "*.git*" \
            -x "*__pycache__*" \
            -x "*.pytest_cache*" \
            -x "*.venv*" \
            -x "dist/*" \
            -x "build/*" \
            -x "*.egg-info*" \
            -x ".coverage*" \
            -x "coverage.*"
            
          echo "Arquivos gerados para deploy:"
          ls -lh dist/

      - name: 7. Disponibilizar Artefato no Resumo do Workflow
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ steps.vars.outputs.VERSION }}
          path: dist/*
          retention-days: 30

      - name: 8. Criar Release Oficial no GitHub com o Source Zipado
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.VERSION }}
          name: "Release ${{ steps.vars.outputs.VERSION }} - LangGraph Proxy for Continue.dev"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*.zip
            dist/*.whl
            dist/*.tar.gz